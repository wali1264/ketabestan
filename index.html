<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description" content="کتابستان - سیستم مدیریت فروشگاه" />
  <title>کتابستان</title>
  
  <!-- PWA Configuration -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #fdfcfb;
      color: #1f2937;
      overflow: hidden;
      overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile for app-like feel */
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.1), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(34, 197, 94, 0.1), transparent 35%),
        radial-gradient(circle at 50% 80%, rgba(234, 179, 8, 0.1), transparent 35%);
      background-size: 150% 150%;
      animation: aurora 25s ease infinite;
    }
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Typography System */
    h1 {
        font-size: 2.5rem; /* 40px */
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #111827;
    }
     h2 {
        font-size: 1.75rem; /* 28px */
        font-weight: 700;
        color: #1f2937;
    }
    
    /* Interactive Elements */
    .btn-primary {
        transition: all 0.3s ease;
        transform: translateY(0);
    }
    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2), 0 4px 6px -2px rgba(59, 130, 246, 0.1);
    }
    .form-input {
        transition: all 0.2s ease-in-out;
    }
    .form-input:focus {
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        border-color: #3b82f6;
    }
    
    /* Zebra Striping for Tables */
    .table-zebra tbody tr:nth-child(even) {
      background-color: rgba(59, 130, 246, 0.04);
    }
    
    /* Modal Animation */
    .modal-animate {
        animation: modal-zoom-in 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes modal-zoom-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    
    /* Responsive Tables */
    @media (max-width: 767px) {
      .responsive-table thead {
          display: none;
      }
      .responsive-table tr {
          display: block;
          border: 1px solid #e5e7eb;
          border-radius: 0.75rem;
          margin-bottom: 1rem;
          padding: 1rem;
          background-color: rgba(255,255,255,0.7);
      }
      .responsive-table td {
          display: block;
          text-align: left; /* for RTL */
          padding: 0.5rem 0;
          border: none;
          position: relative;
          padding-right: 50%; /* for RTL */
      }
      .responsive-table td:before {
          content: attr(data-label);
          position: absolute;
          right: 0.5rem; /* for RTL */
          width: 45%;
          padding-left: 0.5rem; /* for RTL */
          font-weight: 600;
          text-align: right; /* for RTL */
          color: #374151;
      }
      .responsive-table td:last-child {
          border-bottom: none;
      }
      .responsive-table td.actions-cell {
          padding-right: 0;
          text-align: center;
      }
      .responsive-table td.actions-cell:before {
          content: none;
      }
    }


    @media print {
      @page {
        size: A4;
        margin: 1.5cm;
      }
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background: #fff !important;
        color: #000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-modal-content, #print-modal-content * {
        visibility: visible;
      }
      #print-modal-content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
        color: #000;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        page-break-inside: auto;
      }
      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
      thead {
        display: table-header-group;
      }
      tbody {
        display: table-row-group;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 8px;
        color: #000 !important;
        background-color: transparent !important;
      }
      h1, h2, h3, p {
         color: #000 !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {

</head>

  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
<script type="module" src="/index.tsx"></script>

</html>
